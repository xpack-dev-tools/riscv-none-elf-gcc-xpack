name: 'Test xPack GNU RISC-V Embedded GCC on supported platforms'

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'The folder part of the URL where binaries are stored'
        required: false
        default: 'release'
      version:
        description: 'The semver of the release'
        required: false
        default: 'current'
      helper-git-ref:
        description: 'The helper branch, tag or SHA to checkout'
        required: false
        default: 'xpack-development'

jobs:


  win32-x64-test:
    name: 'win32-x64 riscv-none-elf-gcc ${{github.event.inputs.version}} test 2025'
    runs-on: windows-2022
    defaults:
      run:
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
        shell: bash # for --

    steps:
      - name: Enable Long Path Support
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          Write-Host "Long Path Support enabled"
        shell: powershell

      - name: 'Show environment'
        run: |
          uname -a
          systeminfo # lsb_release -sd
          echo "whoami: $(whoami)"
          echo "pwd: $(pwd)"
          ls -lLA
          env | sort | grep -E '^[^ \t]+='

      # https://github.com/actions/checkout
      - name: 'Checkout project'
        uses: actions/checkout@v5
        with:
          fetch-depth: 3

      - name: 'Checkout helper ${{github.event.inputs.helper-git-ref}}'
        uses: actions/checkout@v5
        with:
          repository: xpack-dev-tools/xbb-helper-xpack
          path: build-assets/xpacks/@xpack-dev-tools/xbb-helper
          ref: ${{github.event.inputs.helper-git-ref}}
          fetch-depth: 3

      - name: 'Move workspace to short path for MinGW compatibility'
        run: |
          # Create short path directory
          mkdir D:\t
          echo "Created D:\t directory"

          # Move entire workspace to short path
          echo "Moving workspace from ${{ github.workspace }} to D:\t..."
          robocopy "${{ github.workspace }}" "D:\t" /E /MOVE /NFL /NDL /NJH /NJS /NC /NS

          # Verify the move
          if [ -d "D:\t\build-assets" ]; then
            echo "✓ Workspace successfully moved to D:\t"
            ls -la D:\t
          else
            echo "✗ Failed to move workspace"
            exit 1
          fi
        shell: bash

      - name: 'Run ${{github.event.inputs.version}} native test'
        working-directory: D:\t
        env:
          # Use short temp paths
          TMP: D:/tmp
          TEMP: D:/tmp
          TMPDIR: D:/tmp
        run: |
          # Create temp directory
          mkdir -p D:/tmp
          # Run the test from the short path
          bash build-assets/scripts/test.sh --version ${{github.event.inputs.version}} --base-url ${{github.event.inputs.base_url}} --develop


